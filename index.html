<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Careta Cam</title>
<style>
:root{--bg:#1b1036;--card:#2a1a52;--pink:#ff5fa2;--yellow:#ffd23f;--blue:#3ec5ff;--green:#4be08a;--text:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;background:#000}
#cam{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
#remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
#me{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
body.call #remote{display:block}
body.call #me{inset:auto;top:calc(14px + env(safe-area-inset-top));right:14px;width:27vw;max-width:280px;height:auto;object-fit:contain;border-radius:20px;border:3px solid #fff;box-shadow:0 8px 24px #0009;z-index:3}

#status{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:4;background:#0008;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px;border-radius:999px;font-weight:700;font-size:17px;max-width:62vw;display:none}
body.wait #status,body.call #status,body.solo #status{display:block}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000a 35%);display:none}
body.wait #panel,body.call #panel,body.solo #panel{display:block}
#row{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;gap:10px}
#targets{display:none;gap:8px}
body.call #targets{display:flex}
.chip{border:0;border-radius:999px;padding:10px 16px;font-size:16px;font-weight:800;background:#ffffff26;color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.on{background:var(--yellow);color:#2a1a52}
#controls{display:flex;gap:10px;margin-left:auto}
.ctl{width:56px;height:56px;border-radius:50%;border:0;font-size:26px;background:#ffffff2e;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ctl.red{background:#ff3b5c}
.ctl.off{background:#fff;}
#fxbar{display:flex;gap:12px;overflow-x:auto;padding:6px 16px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#fxbar::-webkit-scrollbar{display:none}
.fx{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#fff;font-weight:700;font-size:13px;scroll-snap-align:start}
.fx .ic{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:#ffffff2a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid transparent;transition:transform .15s}
.fx.on .ic{border-color:var(--yellow);transform:scale(1.12);background:#ffd23f44}
#loadingfx{padding:18px;font-weight:700;opacity:.85}

#lobby{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,#ff5fa255,transparent 45%),radial-gradient(circle at 85% 80%,#3ec5ff55,transparent 45%),var(--bg)}
body:not(.lobby) #lobby{display:none}
.card{width:min(460px,100%);background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:0 20px 60px #0007;text-align:center}
.card h1{margin:0;font-size:44px;letter-spacing:.5px}
.card p.sub{margin:6px 0 22px;opacity:.85;font-size:17px}
.card label{display:block;text-align:left;font-weight:800;margin:14px 4px 6px;font-size:15px;opacity:.9}
.card input{width:100%;font-size:22px;padding:14px 16px;border-radius:16px;border:3px solid #ffffff22;background:#ffffff14;color:#fff;font-weight:700;outline:none;text-transform:none}
.card input:focus{border-color:var(--yellow)}
.big{width:100%;margin-top:18px;border:0;border-radius:18px;padding:18px;font-size:22px;font-weight:900;color:#2a1a52;background:var(--yellow);box-shadow:0 6px 0 #c99d10}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #c99d10}
.big.alt{background:var(--blue);box-shadow:0 6px 0 #1f8fc0}
.hint{font-size:14px;opacity:.7;margin-top:14px;line-height:1.4}
.emojis{font-size:34px;letter-spacing:6px;margin-bottom:6px}

#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px) scale(.9);z-index:20;background:#fff;color:#2a1a52;font-weight:900;font-size:22px;padding:16px 24px;border-radius:22px;box-shadow:0 12px 40px #0008;opacity:0;pointer-events:none;transition:all .3s;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

#tapaudio{position:fixed;inset:0;z-index:15;display:none;place-items:center;background:#0009;border:0;color:#fff;font-size:28px;font-weight:900}
#photo{position:fixed;inset:0;z-index:30;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
#photo img{max-width:100%;max-height:72vh;border-radius:18px;border:4px solid #fff;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#photo .btns{display:flex;gap:12px}
#photo .btns button{border:0;border-radius:16px;padding:14px 22px;font-size:19px;font-weight:900}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25;transition:opacity .4s}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<body class="lobby">

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <video id="remote" playsinline autoplay></video>

</div>

<div id="status"></div>

<div id="panel">
  <div id="row">
    <div id="targets">
      <button class="chip on" data-t="me">🙋 Em mim</button>
      <button class="chip" data-t="other" id="chipOther">🎯 No outro</button>
    </div>
    <div id="controls">
      <button class="ctl" id="btnPhoto" title="Foto">📸</button>
      <button class="ctl" id="btnMute" title="Microfone">🎤</button>

    </div>
  </div>
  <div id="fxbar"><div id="loadingfx">Carregando as máscaras… ⏳</div></div>
</div>

<div id="lobby">
  <div class="card">
    <div class="emojis">🐶🤡👑🦄👽</div>

<input type="file" id="pickPhoto" accept="image/*" style="display:none">

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import Delaunator from "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm";
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

const $ = s => document.querySelector(s);
const video = $('#cam'), canvas = $('#me'), ctx = canvas.getContext('2d'), remote = $('#remote');
const PREFIX = 'careta-cam-v1-';

let landmarker = null, camStream = null, outStream = null;
let peer = null, call = null, conn = null, isHost = false, roomCode = '';
let myFx = 'none', target = 'me', myName = '', otherName = '';
let lastVideoTime = -1, faces = null, particles = [], wakeLock = null;

/* ---------- helpers ---------- */
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
const off = (f,p,s,u) => ({x:p.x + f.side.x*s + f.up.x*u, y:p.y + f.side.y*s + f.up.y*u});
function at(x,y,a,fn){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); fn(); ctx.restore(); }
function ell(x,y,rx,ry,color,rot=0){ ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(x,y,Math.max(rx,.1),Math.max(ry,.1),rot,0,Math.PI*2); ctx.fill(); }
function circ(x,y,r,color){ ell(x,y,r,r,color); }
function emoji(ch,x,y,size,a=0){
  at(x,y,a,()=>{ ctx.globalAlpha=1; ctx.fillStyle='#000';
    ctx.font=`${Math.max(8,size)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ch,0,0); });
}
const now = () => performance.now()/1000;

const JAW = [234,93,132,58,172,136,150,149,176,148,152,377,400,378,379,365,397,288,361,323,454];
const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

function face(lm,W,H){
  const P = i => ({x:(1-lm[i].x)*W, y:lm[i].y*H});   // espelhado (como aparece na tela)
  const R = i => ({x:lm[i].x*W, y:lm[i].y*H});       // coordenada crua do vídeo
  const A = P(454), B = P(234);
  const ang = Math.atan2(B.y-A.y, B.x-A.x);
  const top = P(10), chin = P(152);
  const w = dist(A,B), h = dist(top,chin);
  return { P, R, ang, w, h, top, chin, c:mid(top,chin), nose:P(4),
    mouth: h ? dist(P(13),P(14))/h : 0,
    eyeL: mid(P(33),P(133)), eyeR: mid(P(362),P(263)),
    up:{x:Math.sin(ang), y:-Math.cos(ang)}, side:{x:Math.cos(ang), y:Math.sin(ang)}, lm, W, H };
}

/* warp: amplia uma região do próprio vídeo (cabeção, olhão, bocão) */
function magnify(cx,cy,srcR,scale,shiftY=0,ellipseRatio=1){
  const W=canvas.width;
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  const dr = srcR*scale, dy = cy + shiftY;
  ctx.beginPath(); ctx.ellipse(cx,dy,dr*0.97,dr*0.97*ellipseRatio,0,0,Math.PI*2); ctx.clip();
  ctx.drawImage(video, cx-srcR, cy-srcR*ellipseRatio, srcR*2, srcR*2*ellipseRatio, cx-dr, dy-dr*ellipseRatio, dr*2, dr*2*ellipseRatio);
  ctx.restore();
}

/* ---------- máscaras ---------- */
/* ---------- troca de rosto ---------- */
const EYE_L=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
const EYE_R=[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
const LIPS_IN=[78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
let swap=null, swapData=null, imageLandmarker=null, pendingTarget='me';

/* geometria */
function segDist(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y; const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/((dx*dx+dy*dy)||1))); return Math.hypot(p.x-a.x-t*dx, p.y-a.y-t*dy); }
function distToPoly(p,poly){ let m=1e9; for(let k=0;k<poly.length;k++) m=Math.min(m,segDist(p,poly[k],poly[(k+1)%poly.length])); return m; }
function inPoly(p,poly){ let ins=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i],b=poly[j]; if(((a.y>p.y)!==(b.y>p.y)) && p.x<(b.x-a.x)*(p.y-a.y)/((b.y-a.y)||1e-9)+a.x) ins=!ins; } return ins; }
const smooth = a => { a=Math.max(0,Math.min(1,a)); return a*a*(3-2*a); };

/* cor média e variação da pele (parte central do rosto) */
const statC=document.createElement('canvas'); statC.width=statC.height=40;
const statX=statC.getContext('2d',{willReadFrequently:true});
function faceStats(src,pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const i of OVAL){ const p=pts[i]; x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  const bw=x1-x0, bh=y1-y0; if(bw<8||bh<8) return null;
  statX.clearRect(0,0,40,40);
  try{ statX.drawImage(src,x0,y0,bw,bh,0,0,40,40); }catch(e){ return null; }
  const d=statX.getImageData(0,0,40,40).data, s=[0,0,0], q=[0,0,0]; let n=0;
  for(let y=0;y<40;y++) for(let x=0;x<40;x++){
    const ex=(x-20)/20, ey=(y-22)/20; if(ex*ex+ey*ey>0.45) continue;
    const k=(y*40+x)*4; for(let c=0;c<3;c++){ const v=d[k+c]/255; s[c]+=v; q[c]+=v*v; } n++;
  }
  if(!n) return null;
  const m=s.map(v=>v/n); return {m, sd:q.map((v,c)=>Math.sqrt(Math.max(1e-4,v/n-m[c]*m[c])))};
}

/* WebGL: desenha o rosto da foto deformado sobre o rosto ao vivo */
const glc=document.createElement('canvas');
let G=null;
function initGL(){
  if(G) return G;
  const gl=glc.getContext('webgl',{premultipliedAlpha:false,alpha:true,antialias:true});
  if(!gl) return null;
  const sh=(t,src)=>{ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s); return s; };
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,`attribute vec2 aPos; attribute vec2 aUv; attribute float aA; uniform vec2 uSize; varying vec2 vUv; varying float vA;
    void main(){ vUv=aUv; vA=aA; vec2 p=aPos/uSize*2.0-1.0; gl_Position=vec4(p.x,-p.y,0.0,1.0); }`));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision mediump float; uniform sampler2D uTex; uniform vec3 uMS,uMT,uK; varying vec2 vUv; varying float vA;
    void main(){ vec3 c=texture2D(uTex,vUv).rgb; c=(c-uMS)*uK+uMT; gl_FragColor=vec4(clamp(c,0.0,1.0),vA); }`));
  gl.linkProgram(pr); gl.useProgram(pr);
  G={gl,pr,pos:gl.createBuffer(),uv:gl.createBuffer(),al:gl.createBuffer(),idx:gl.createBuffer(),tex:gl.createTexture(),
     L:n=>gl.getAttribLocation(pr,n), U:n=>gl.getUniformLocation(pr,n), texFor:null, n:0, posArr:new Float32Array(478*2)};
  return G;
}
function uploadSwap(){
  const {gl}=G, s=swap;
  gl.bindTexture(gl.TEXTURE_2D,G.tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,s.img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.bindBuffer(gl.ARRAY_BUFFER,G.uv); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(s.pts.flatMap(p=>[p.x/s.img.width,p.y/s.img.height])),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,G.al); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(s.alpha),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,G.idx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(s.tris),gl.STATIC_DRAW);
  G.n=s.tris.length; G.texFor=s; G.tStats=null;
}

async function getImageLandmarker(){
  if(!imageLandmarker){
    const files=await FilesetResolver.forVisionTasks(WASM);
    imageLandmarker=await FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},runningMode:'IMAGE',numFaces:1});
  }
  return imageLandmarker;
}
function loadImg(src){ return new Promise((ok,err)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=err; i.src=src; }); }
async function fileToDataUrl(file){
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); const k=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.9);
  } finally { URL.revokeObjectURL(url); }
}
async function prepareSwap(dataUrl, quiet=false){
  try{
    const img=await loadImg(dataUrl);
    const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0);
    const res=(await getImageLandmarker()).detect(c);
    if(!res.faceLandmarks?.length){ if(!quiet) toast('Não achei um rosto nessa foto 😕 Tente uma de frente.'); return null; }
    const pts=res.faceLandmarks[0].slice(0,468).map(p=>({x:p.x*c.width, y:p.y*c.height}));
    const P=idx=>idx.map(i=>pts[i]);
    const oval=P(OVAL), eL=P(EYE_L), eR=P(EYE_R), lip=P(LIPS_IN);
    const fw=Math.hypot(pts[234].x-pts[454].x, pts[234].y-pts[454].y);
    const browA={x:(pts[105].x+pts[334].x)/2, y:(pts[105].y+pts[334].y)/2};
    let ux=-(pts[454].y-pts[234].y)/fw, uy=(pts[454].x-pts[234].x)/fw;
    if(ux*(pts[10].x-pts[152].x)+uy*(pts[10].y-pts[152].y)<0){ ux=-ux; uy=-uy; }
    // transparência suave: some perto da borda do rosto, dos olhos e da boca
    const alpha=pts.map(p=>{
      let a=inPoly(p,oval) ? smooth(distToPoly(p,oval)/(0.13*fw)) : 0;
      for(const h of [eL,eR]) a*= inPoly(p,h) ? 0 : smooth(distToPoly(p,h)/(0.035*fw));
      a*= inPoly(p,lip) ? 0 : smooth(distToPoly(p,lip)/(0.03*fw));
      const hb=((browA.x-p.x)*ux+(browA.y-p.y)*uy)*-1; // altura acima das sobrancelhas
      if(hb>0) a*=smooth(1-hb/(0.3*fw));
      return a;
    });
    const tri=Delaunator.from(pts.map(p=>[p.x,p.y])).triangles, tris=[];
    for(let i=0;i<tri.length;i+=3){
      const a=pts[tri[i]], b=pts[tri[i+1]], d=pts[tri[i+2]], g={x:(a.x+b.x+d.x)/3, y:(a.y+b.y+d.y)/3};
      if(!inPoly(g,oval) || inPoly(g,eL) || inPoly(g,eR) || inPoly(g,lip)) continue;
      tris.push(tri[i],tri[i+1],tri[i+2]);
    }
    const st=faceStats(c,pts);
    return {img:c, pts, tris, alpha, st};
  }catch(e){ console.error(e); if(!quiet) toast('Não consegui usar essa foto 😕'); return null; }
}
let swapFrame=0;
function drawSwap(f,src=video){
  if(!swap || !initGL()) return;
  const {gl}=G, W=f.W, H=f.H;
  if(glc.width!==W||glc.height!==H){ glc.width=W; glc.height=H; }
  if(G.texFor!==swap) uploadSwap();
  // luz/cor do rosto ao vivo (atualiza a cada poucos quadros, de forma suave)
  if((swapFrame++%4===0) || !G.tStats){
    const raw=f.lm.slice(0,468).map(p=>({x:p.x*W, y:p.y*H}));
    const t=faceStats(src,raw);
    if(t){ if(!G.tStats) G.tStats=t; else for(let c=0;c<3;c++){ G.tStats.m[c]+= (t.m[c]-G.tStats.m[c])*0.35; G.tStats.sd[c]+= (t.sd[c]-G.tStats.sd[c])*0.35; } }
  }
  const S=swap.st, T=G.tStats||S;
  const k=[0,1,2].map(c=> S&&T ? Math.max(0.55,Math.min(1.8,T.sd[c]/S.sd[c])) : 1);
  for(let i=0;i<468;i++){ G.posArr[i*2]=f.lm[i].x*W; G.posArr[i*2+1]=f.lm[i].y*H; }
  gl.viewport(0,0,W,H); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.BLEND); gl.useProgram(G.pr);

  gl.bindBuffer(gl.ARRAY_BUFFER,G.al); l=G.L('aA'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,1,gl.FLOAT,false,0,0);
  gl.uniform2f(G.U('uSize'),W,H);
  gl.uniform3fv(G.U('uMS'),S&&T?S.m:[0,0,0]); gl.uniform3fv(G.U('uMT'),S&&T?T.m:[0,0,0]); gl.uniform3fv(G.U('uK'),k);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,G.tex); gl.uniform1i(G.U('uTex'),0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,G.idx); gl.drawElements(gl.TRIANGLES,G.n,gl.UNSIGNED_SHORT,0);
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(glc,0,0); ctx.restore();
}

/* ---------- render ---------- */
function updateParticles(){
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=canvas.height*0.0009; p.life-=0.018;
    ctx.globalAlpha=Math.max(0,p.life); circ(p.x,p.y,p.r,p.c); }
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0 && p.y<canvas.height+50);
}

function loop(){
  const W=video.videoWidth, H=video.videoHeight;
  if(W && (canvas.width!==W || canvas.height!==H)){ canvas.width=W; canvas.height=H; }
  if(W){
    if(landmarker && myFx!=='none' && video.currentTime!==lastVideoTime){
      lastVideoTime=video.currentTime;
      try{ faces=landmarker.detectForVideo(video, performance.now()).faceLandmarks; }catch(e){ faces=null; }
    }
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(video,0,0,W,H); ctx.restore();
    const fx=FX[myFx];
    if(faces && fx && myFx!=='none'){
      const fs=faces.map(lm=>face(lm,W,H));
      for(const f of fs) fx.warp && fx.warp(f);
      for(const f of fs) fx.draw && fx.draw(f);
    }
    updateParticles();
  }
  requestAnimationFrame(loop);
}

/* ---------- câmera e modelo ---------- */
async function loadModel(){
  try{
    const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:3});
    try{ landmarker=await FaceLandmarker.createFromOptions(files,opts('GPU')); }
    catch(e){ landmarker=await FaceLandmarker.createFromOptions(files,opts('CPU')); }
    buildFxBar();
    const saved=localStorage.getItem('careta-swap');
    if(saved){ swapData=saved; prepareSwap(saved,true).then(s=>{ if(s) swap=s; }); }
  }catch(e){ $('#loadingfx').textContent='Não consegui carregar as máscaras 😢 Verifique a internet e recarregue.'; console.error(e); }
}

async function startCamera(){
  if(camStream) return;
  camStream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  video.srcObject=camStream; await video.play();
  canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||480;
  const cs=canvas.captureStream(30);
  outStream=new MediaStream([cs.getVideoTracks()[0], ...camStream.getAudioTracks()]);
  requestAnimationFrame(loop);
}

async function keepAwake(){ try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !document.body.classList.contains('lobby')) keepAwake(); });

/* ---------- UI ---------- */
function setMode(m){ document.body.className=m; }
function status(t){ $('#status').textContent=t; }
let toastTimer;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }

function buildFxBar(){
  const bar=$('#fxbar'); bar.innerHTML='';
  for(const [id,fx] of Object.entries(FX)){
    const b=document.createElement('button'); b.className='fx'+(id===myFx?' on':''); b.dataset.id=id;
    b.innerHTML=`<div class="ic">${fx.icon}</div><div>${fx.label}</div>`;
    b.onclick=()=>pickFx(id); bar.appendChild(b);
  }
}
function setMyFx(id){
  myFx=id; particles=[];
  document.querySelectorAll('.fx').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(FX[id]?.hint) toast(FX[id].hint);
}
function sendSwap(){
  conn.send({t:'swapimg',data:swapData,from:myName});
  toast(`Você colocou seu 🎭 rosto da foto em ${otherName||'quem está do outro lado'}! 😂`);
}
function pickSwap(){
  const toOther = target==='other' && conn && conn.open;
  if(toOther && swapData){ sendSwap(); return; }
  if(!toOther && swap && myFx!=='swap'){ setMyFx('swap'); toast('Toque de novo em 🎭 para trocar a foto'); return; }
  pendingTarget = toOther ? 'other' : 'me';
  const inp=$('#pickPhoto'); inp.value=''; inp.click();
}
$('#pickPhoto').onchange=async()=>{
  const file=$('#pickPhoto').files[0]; if(!file) return;
  toast('Procurando o rosto na foto… 🔍');
  const url=await fileToDataUrl(file);
  const s=await prepareSwap(url); if(!s) return;
  swap=s; swapData=url;
  try{ localStorage.setItem('careta-swap',url); }catch(e){}
  if(pendingTarget==='other' && conn && conn.open) sendSwap();
  else { setMyFx('swap'); toast('Rosto trocado! 🎭'); }
};
function pickFx(id){
  if(id==='swap') return pickSwap();
  if(target==='other' && conn && conn.open){
    conn.send({t:'fx',id,from:myName});
    toast(`Você colocou ${FX[id].icon} em ${otherName||'quem está do outro lado'}! 😂`);
  } else setMyFx(id);
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  target=c.dataset.t; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
});

/* ---------- chamada (PeerJS) ---------- */
function onData(d){
  if(!d || typeof d!=='object') return;
  if(d.t==='hi'){ otherName=String(d.name||'').slice(0,20); $('#chipOther').textContent=`🎯 No(a) ${otherName||'outro'}`; status(`📞 Com ${otherName||'a família'}`); }
  if(d.t==='swapimg' && typeof d.data==='string' && d.data.startsWith('data:image/') && d.data.length<3e6){
    prepareSwap(d.data,true).then(s=>{ if(!s) return; swap=s; setMyFx('swap'); toast(`${d.from||'Alguém'} trocou seu rosto! 🎭😂`); });
  }
  if(d.t==='fx' && FX[d.id]){ setMyFx(d.id); toast(`${d.from||'Alguém'} colocou ${FX[d.id].icon} ${FX[d.id].label} em você! 😂`); }
}
function attachConn(c){
  conn=c;
  c.on('open',()=>c.send({t:'hi',name:myName}));
  c.on('data',onData);
  c.on('close',()=>{ if(conn===c) conn=null; });
}
function attachCall(c){
  call=c;
  c.on('stream',s=>{
    remote.srcObject=s; setMode('call');
    if(!otherName) status('📞 Conectado!');
    remote.play().catch(()=>{ $('#tapaudio').style.display='grid'; });
  });
  c.on('close',()=>partnerLeft(c));
  c.on('error',()=>partnerLeft(c));
}
function partnerLeft(c){
  if(call!==c) return;
  call=null; conn=null; remote.srcObject=null; otherName='';
  $('#chipOther').textContent='🎯 No outro'; target='me';
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.t==='me'));
  toast('A chamada caiu 👋');
  if(isHost){ setMode('wait'); status('⏳ Esperando alguém entrar…'); }
  else { setMode('wait'); status('🔄 Reconectando…'); peer?.destroy(); peer=null; setTimeout(()=>roomCode&&joinRoom(roomCode),1500); }
}
function joinRoom(code){
  const id=PREFIX+code;
  isHost=false; status('🔌 Conectando…');
  peer=new Peer(id,{debug:0});
  peer.on('open',()=>{ isHost=true; status('⏳ Esperando alguém entrar com o mesmo código…'); });
  peer.on('call',c=>{ if(call){ c.close(); return; } c.answer(outStream); attachCall(c); });
  peer.on('connection',c=>{ if(conn && conn.open){ c.close(); return; } attachConn(c); });
  peer.on('disconnected',()=>{ try{ peer && !peer.destroyed && peer.reconnect(); }catch(e){} });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      peer.destroy();
      peer=new Peer({debug:0});
      peer.on('open',()=>{ status('📞 Chamando…'); attachConn(peer.connect(id,{reliable:true})); attachCall(peer.call(id,outStream)); });
      peer.on('error',err=>retry(err));
    } else retry(e);
  });
}
function retry(e){
  console.warn(e);
  if(!roomCode) return;
  status('🔄 Tentando de novo…');
  try{ peer?.destroy(); }catch(_){}
  peer=null; call=null; conn=null;
  setTimeout(()=>roomCode&&joinRoom(roomCode),2500);
}
function hangup(){
  roomCode='';
  try{ call?.close(); conn?.close(); peer?.destroy(); }catch(e){}
  call=conn=peer=null; remote.srcObject=null; otherName='';
  try{ wakeLock?.release(); }catch(e){}
  setMode('lobby');
}

/* ---------- botões ---------- */
$('#name').value=localStorage.getItem('careta-name')||'';
$('#code').value=localStorage.getItem('careta-code')||'';

async function begin(mode){
  myName=$('#name').value.trim()||'Alguém';
  try{ await startCamera(); }
  catch(e){ alert('Preciso da câmera e do microfone. Libere nas permissões do Safari e tente de novo.'); return false; }
  localStorage.setItem('careta-name',$('#name').value.trim());
  keepAwake(); return true;
}
$('#btnSolo').onclick=async()=>{ if(await begin()){ setMode('solo'); status('🪞 Espelho mágico'); } };
$('#btnJoin').onclick=async()=>{
  const code=$('#code').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(code.length<4){ alert('Digite um código da família com pelo menos 4 letras ou números.'); return; }
  if(!(await begin())) return;
  localStorage.setItem('careta-code',code);
  roomCode=code; setMode('wait'); joinRoom(code);
};
$('#btnEnd').onclick=hangup;
$('#btnMute').onclick=()=>{
  const tr=camStream?.getAudioTracks()[0]; if(!tr) return;
  tr.enabled=!tr.enabled; $('#btnMute').textContent=tr.enabled?'🎤':'🔇'; $('#btnMute').classList.toggle('off',!tr.enabled);
  toast(tr.enabled?'Microfone ligado 🎤':'Microfone desligado 🔇');
};
$('#tapaudio').onclick=()=>{ remote.play(); $('#tapaudio').style.display='none'; };

let lastPhotoBlob=null;
$('#btnPhoto').onclick=()=>{
  const out=document.createElement('canvas'), o=out.getContext('2d');
  if(document.body.classList.contains('call') && remote.videoWidth){
    out.width=remote.videoWidth; out.height=remote.videoHeight;
    o.drawImage(remote,0,0);
    const pw=out.width*0.3, ph=pw*canvas.height/canvas.width, m=out.width*0.02;
    o.fillStyle='#fff'; o.fillRect(out.width-pw-m-4,m-4,pw+8,ph+8);
    o.drawImage(canvas,out.width-pw-m,m,pw,ph);
  } else { out.width=canvas.width; out.height=canvas.height; o.drawImage(canvas,0,0); }
  const fl=$('#flash'); fl.style.transition='none'; fl.style.opacity=1; requestAnimationFrame(()=>{ fl.style.transition='opacity .4s'; fl.style.opacity=0; });
  $('#photoImg').src=out.toDataURL('image/jpeg',0.92);
  out.toBlob(b=>lastPhotoBlob=b,'image/jpeg',0.92);
  $('#photo').style.display='flex';
};
$('#btnClosePhoto').onclick=()=>$('#photo').style.display='none';
$('#btnShare').onclick=async()=>{
  try{
    const file=new File([lastPhotoBlob],'careta.jpg',{type:'image/jpeg'});
    if(navigator.canShare?.({files:[file]})) await navigator.share({files:[file],title:'Careta Cam'});
    else toast('Segure a foto para salvar 📲');
  }catch(e){}
};

/* teste interno: troca de rosto entre duas imagens (sem câmera) */
window.__caretaTest=async(srcUrl,dstUrl)=>{
  const s=await prepareSwap(srcUrl,true); if(!s) return 'sem rosto na origem';
  swap=s; const d=await prepareSwap(dstUrl,true); if(!d) return 'sem rosto no destino';
  const W=d.img.width,H=d.img.height; canvas.width=W; canvas.height=H; G&&(G.tStats=null);
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(d.img,0,0); ctx.restore();
  const lm=d.pts.map(p=>({x:p.x/W,y:p.y/H})); drawSwap(face(lm,W,H),d.img);
  return canvas.toDataURL('image/jpeg',0.85);
};
